<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagecoach — One login. Every VM. One click.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17' fill='none' stroke='%23e07b3c' stroke-width='4'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23c05621'/%3E%3C/svg%3E">
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.umd.js"></script>
<style>
  :root {
    --ink: #16130f;
    --ink-2: #1f1b15;
    --ink-3: #2a251d;
    --line: #3a332810;
    --edge: #3d362b;
    --parchment: #efe6d5;
    --parchment-dim: #b8ad97;
    --faint: #7d7460;
    --rust: #c05621;
    --rust-hi: #e07b3c;
    --brass: #d6a94f;
    --sage: #7fa06a;
    --blood: #c04a3a;
    --sky: #6f9bbf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--parchment);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border-bottom: 1px solid var(--edge);
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    position: sticky; top: 0; z-index: 5;
  }
  .wheel { width: 34px; height: 34px; flex: none; }
  .wordmark { font-size: 19px; font-weight: 700; letter-spacing: 3.5px; color: var(--parchment); }
  .wordmark span { color: var(--rust-hi); }
  .tagline { color: var(--faint); font-size: 12px; margin-top: 1px; letter-spacing: .4px; }
  .topbar .grow { flex: 1; }
  .account-chip {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: var(--ink-3); border: 1px solid var(--edge); border-radius: 20px;
    color: var(--parchment-dim); font-size: 12.5px;
  }
  .account-chip b { color: var(--parchment); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.on { background: var(--sage); box-shadow: 0 0 6px var(--sage); }
  .dot.off { background: var(--faint); }
  .dot.warn { background: var(--brass); }

  button {
    font: inherit; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--edge); background: var(--ink-3); color: var(--parchment);
    padding: 7px 14px; transition: all .12s ease;
  }
  button:hover:not(:disabled) { border-color: var(--rust-hi); color: #fff; }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary { background: var(--rust); border-color: var(--rust); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--rust-hi); border-color: var(--rust-hi); }
  button.mini { padding: 4px 10px; font-size: 12px; }
  button.ghost { background: transparent; }
  button.danger:hover:not(:disabled) { border-color: var(--blood); color: var(--blood); }

  input[type=text] {
    font: inherit; background: var(--ink-2); border: 1px solid var(--edge);
    color: var(--parchment); border-radius: 6px; padding: 7px 12px; outline: none; width: 100%;
  }
  input[type=text]:focus { border-color: var(--rust-hi); }

  .banner {
    display: flex; align-items: center; gap: 12px; margin: 14px 20px 0;
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    background: #2e2410; border: 1px solid #5c4a1e; color: var(--brass);
  }
  .banner.error { background: #2e1512; border-color: #5c2a22; color: #e0876f; }
  .banner .grow { flex: 1; }

  .main { flex: 1; display: flex; gap: 0; min-height: 0; }
  .content { flex: 1; padding: 16px 20px 40px; min-width: 0; }

  .signin-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
  .card {
    background: var(--ink-2); border: 1px solid var(--edge); border-radius: 12px;
    padding: 32px 36px; max-width: 430px; width: 100%;
    box-shadow: 0 18px 50px #000a;
  }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card p.sub { margin: 0 0 22px; color: var(--faint); font-size: 13px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--parchment-dim); margin-bottom: 5px; letter-spacing: .3px; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--parchment-dim); font-size: 13px; margin: 4px 0 18px; }

  .section-title {
    font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--faint); margin: 22px 0 10px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--edge); }

  .recents { display: flex; gap: 10px; flex-wrap: wrap; }
  .recent-card {
    background: var(--ink-2); border: 1px solid var(--edge); border-radius: 8px;
    padding: 10px 14px; cursor: pointer; min-width: 180px; transition: all .12s ease;
  }
  .recent-card:hover { border-color: var(--rust-hi); transform: translateY(-1px); }
  .recent-card .name { font-weight: 600; margin-bottom: 3px; }
  .recent-card .meta { color: var(--faint); font-size: 12px; }
  .recent-card .go { color: var(--rust-hi); font-size: 12px; margin-top: 5px; font-weight: 600; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin: 4px 0 12px; flex-wrap: wrap; }
  .toolbar input[type=text] { max-width: 300px; }
  .chip {
    padding: 5px 13px; border-radius: 16px; border: 1px solid var(--edge);
    background: transparent; color: var(--parchment-dim); font-size: 12.5px;
  }
  .chip.active { background: var(--rust); border-color: var(--rust); color: #fff; }
  .count { color: var(--faint); font-size: 12.5px; margin-left: auto; }

  table.grid { width: 100%; border-collapse: collapse; }
  .grid th {
    text-align: left; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--edge); font-weight: 600;
  }
  .grid td { padding: 9px 10px; border-bottom: 1px solid #2a251d88; vertical-align: middle; }
  .grid tr.row:hover td { background: #221d1655; }
  .grid tr.dim td { opacity: .45; }
  .machine-name { font-weight: 600; cursor: pointer; color: var(--parchment); }
  .machine-name:hover { color: var(--rust-hi); text-decoration: underline; }
  .badge {
    display: inline-block; font-size: 10.5px; letter-spacing: .8px; font-weight: 700;
    padding: 2.5px 8px; border-radius: 4px; text-transform: uppercase;
  }
  .badge.vm { background: #1d2b38; color: var(--sky); border: 1px solid #2d4356; }
  .badge.arc { background: #34251b; color: var(--rust-hi); border: 1px solid #54382a; }
  .badge.os { background: var(--ink-3); color: var(--parchment-dim); border: 1px solid var(--edge); }
  .route { color: var(--parchment-dim); font-size: 12.5px; }
  .route .why { color: var(--faint); }
  .noroute { color: var(--blood); font-size: 12.5px; }
  .btns { display: flex; gap: 6px; justify-content: flex-end; }

  .drawer-veil { position: fixed; inset: 0; background: #000a; z-index: 20; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 92vw; z-index: 21;
    background: var(--ink-2); border-left: 1px solid var(--edge); padding: 24px 26px;
    overflow-y: auto; box-shadow: -20px 0 60px #000a;
  }
  .drawer h3 { margin: 0 0 2px; font-size: 19px; }
  .drawer .sub { color: var(--faint); font-size: 12.5px; margin-bottom: 18px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 12.5px; margin-bottom: 18px; }
  .kv .k { color: var(--faint); }
  .kv .v { color: var(--parchment-dim); word-break: break-all; }
  .methods { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .method {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
    border: 1px solid var(--edge); border-radius: 8px; cursor: pointer; transition: border-color .12s;
  }
  .method:hover { border-color: var(--faint); }
  .method.sel { border-color: var(--rust-hi); background: #2a1d1255; }
  .method .t { font-weight: 600; }
  .method .d { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .method input { margin-top: 3px; accent-color: var(--rust); }
  .setup-box { border: 1px dashed var(--edge); border-radius: 8px; padding: 12px 14px; margin-top: 18px; }
  .setup-box .t { font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--brass); }
  .setup-box .d { color: var(--faint); font-size: 12px; margin-bottom: 10px; }
  .drawer-actions { display: flex; gap: 10px; margin-top: 20px; }
  .drawer-actions .primary { flex: 1; padding: 10px; font-size: 15px; }

  .sessions {
    width: 270px; flex: none; border-left: 1px solid var(--edge);
    padding: 16px; background: var(--ink-2);
  }
  .session-card { border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; }
  .session-card .name { font-weight: 600; font-size: 13px; }
  .session-card .meta { color: var(--faint); margin: 3px 0 8px; }
  .empty { color: var(--faint); font-size: 12.5px; }

  .toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--ink-3); border: 1px solid var(--edge); border-left: 3px solid var(--rust-hi);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; box-shadow: 0 10px 30px #000c; max-width: 560px;
  }
  .toast.err { border-left-color: var(--blood); }
  .spin {
    display: inline-block; width: 13px; height: 13px; border: 2px solid var(--faint);
    border-top-color: var(--rust-hi); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const h = React.createElement;
const html = htm.bind(h);
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const TOKEN = (location.hash || '#').slice(1);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'X-Stagecoach-Token': TOKEN, 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

const Wheel = () => html`
  <svg class="wheel" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="17" fill="none" stroke="#e07b3c" stroke-width="3"/>
    <circle cx="20" cy="20" r="4.5" fill="#c05621"/>
    ${[0,45,90,135].map(a => html`
      <line key=${a} x1="20" y1="4" x2="20" y2="36" stroke="#d6a94f" stroke-width="1.6"
            transform=${'rotate(' + a + ' 20 20)'} />`)}
  </svg>`;

function powerOn(m) {
  const p = (m.PowerState || '').toLowerCase();
  return p.includes('running') || p.includes('connected');
}

// Mirror of the backend decision tree: which buttons does this row get?
function capabilities(m, windowsClient) {
  const isArc = m.Kind === 'ArcServer' || m.Kind === 1;
  const isWin = /windows/i.test(m.OsType || '');
  const caps = [];
  if (isArc) {
    caps.push({ method: 'Ssh', label: 'SSH', why: 'Arc relay — no inbound ports' });
    if (isWin) caps.push({
      method: 'Rdp', label: 'RDP', why: 'RDP over the Arc SSH relay',
      disabled: !windowsClient, reason: windowsClient ? null : 'Needs a Windows client'
    });
    return { caps, route: 'Arc relay', why: 'outbound agent channel' };
  }
  if (m.BastionName) {
    // Non-Windows clients auto-fall back to a tunnel server-side, so RDP stays enabled.
    caps.push({ method: 'Rdp', label: 'RDP', why: 'via Bastion ' + m.BastionName });
    caps.push({ method: 'Ssh', label: 'SSH', why: 'via Bastion ' + m.BastionName });
    caps.push({ method: 'Tunnel', label: 'Tunnel', why: 'local port → ' + (isWin ? '3389' : '22') });
    const wv = m.BastionSameVNet ? 'same VNet' : 'same subscription (needs peering)';
    return { caps, route: 'Bastion: ' + m.BastionName, why: wv };
  }
  const ip = m.PublicIpAddress || m.PrivateIpAddress;
  if (ip) {
    if (isWin) caps.push({
      method: 'Rdp', label: 'RDP', why: 'direct mstsc to ' + ip,
      disabled: !windowsClient, reason: windowsClient ? null : 'Needs a Windows client'
    });
    caps.push({ method: 'Ssh', label: 'SSH', why: 'az ssh vm' });
    return { caps, route: 'Direct: ' + ip, why: 'no Bastion mapped' };
  }
  return { caps: [], route: null, why: 'No Bastion in reach and no IP address' };
}

function fmtTime(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
}

function App() {
  const [state, setState] = useState(null);        // /api/state
  const [machines, setMachines] = useState(null);  // null = loading
  const [connections, setConnections] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [busy, setBusy] = useState('');            // '', 'login', 'scan', 'ext'
  const [fatal, setFatal] = useState(null);
  const [search, setSearch] = useState('');
  const [kind, setKind] = useState('all');
  const [connectableOnly, setConnectableOnly] = useState(false);
  const [drawer, setDrawer] = useState(null);      // machine object
  const [toasts, setToasts] = useState([]);
  const toastId = useRef(0);

  const toast = useCallback((msg, err) => {
    const id = ++toastId.current;
    setToasts(t => [...t, { id, msg, err }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), err ? 9000 : 5000);
  }, []);

  const loadState = useCallback(() => api('/api/state').then(setState), []);
  const loadConnections = useCallback(() =>
    api('/api/connections').then(d => setConnections(d.connections || [])), []);
  const loadSessions = useCallback(() =>
    api('/api/sessions').then(d => setSessions(d.sessions || [])).catch(() => {}), []);

  const loadInventory = useCallback(async (refresh) => {
    setBusy('scan');
    try {
      const d = await api('/api/inventory' + (refresh ? '?refresh=1' : ''));
      setMachines(d.machines || []);
    } catch (e) {
      setMachines([]);
      toast('Scan failed: ' + e.message, true);
    } finally { setBusy(''); }
  }, [toast]);

  useEffect(() => {
    if (!TOKEN) { setFatal('Missing launch token — open Stagecoach from the Start-Stagecoach window (the URL it prints includes the key).'); return; }
    loadState().catch(e => setFatal(e.message));
    loadConnections().catch(() => {});
    loadSessions();
    const t = setInterval(loadSessions, 5000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (state && state.loggedIn && machines === null) loadInventory(false);
  }, [state]);

  const signIn = async (tenantId, useDeviceCode) => {
    setBusy('login');
    try {
      await api('/api/login', { method: 'POST', body: { tenantId, useDeviceCode } });
      await loadState();
      toast('Signed in.');
    } catch (e) { toast('Sign-in failed: ' + e.message, true); }
    finally { setBusy(''); }
  };

  const installExtensions = async () => {
    setBusy('ext');
    try {
      await api('/api/extensions/install', { method: 'POST' });
      await loadState();
      toast('Azure CLI extensions installed.');
    } catch (e) { toast('Extension install failed: ' + e.message, true); }
    finally { setBusy(''); }
  };

  const connect = async (machine, method, username) => {
    try {
      const d = await api('/api/connect', { method: 'POST', body: { id: machine.Id, method, username } });
      let msg = (d.method || method) + ' session launching for ' + machine.Name + '.';
      if (d.method === 'Tunnel' && d.localPort) msg += ' Tunnel on 127.0.0.1:' + d.localPort + '.';
      toast(msg);
      (d.notes || []).forEach(n => toast(n));
      setDrawer(null);
      loadConnections();
      setTimeout(loadSessions, 1200);
    } catch (e) { toast('Connect failed: ' + e.message, true); }
  };

  const reconnect = (c) => {
    const m = (machines || []).find(x => x.Id === c.TargetId);
    if (!m) { toast('That machine is not in the current inventory — refresh the scan.', true); return; }
    connect(m, c.Method || 'Auto', c.Username || '');
  };

  const stopSession = async (s) => {
    try { await api('/api/sessions/stop', { method: 'POST', body: { sessionId: s.SessionId } }); loadSessions(); }
    catch (e) { toast('Stop failed: ' + e.message, true); }
  };

  const arcSetup = async (machine, what) => {
    const label = what === 'enable'
      ? 'Enable SSH connectivity (creates the Arc connection endpoint + SSH service config in Azure)'
      : 'Install the WindowsOpenSSH extension on this server (Azure write, takes a few minutes)';
    if (!confirm(label + '\n\nTarget: ' + machine.Name + '\n\nProceed?')) return;
    try {
      await api(what === 'enable' ? '/api/arc/enable-ssh' : '/api/openssh/install',
        { method: 'POST', body: { id: machine.Id } });
      toast((what === 'enable' ? 'Arc SSH connectivity enabled on ' : 'OpenSSH extension installed on ') + machine.Name + '.');
    } catch (e) { toast('Setup failed: ' + e.message, true); }
  };

  const filtered = useMemo(() => {
    let list = machines || [];
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(m => (m.Name || '').toLowerCase().includes(q) ||
                              (m.ResourceGroup || '').toLowerCase().includes(q));
    }
    if (kind === 'vm') list = list.filter(m => m.Kind === 'AzureVM' || m.Kind === 0);
    if (kind === 'arc') list = list.filter(m => m.Kind === 'ArcServer' || m.Kind === 1);
    if (connectableOnly && state) list = list.filter(m => capabilities(m, state.windowsClient).caps.length > 0);
    return list;
  }, [machines, search, kind, connectableOnly, state]);

  if (fatal) return html`
    <div class="signin-wrap"><div class="card">
      <h2>Can’t reach the stagecoach</h2>
      <p class="sub">${fatal}</p>
    </div></div>`;

  if (!state) return html`
    <div class="signin-wrap"><div class="card"><h2><span class="spin"></span>  Hitching up…</h2></div></div>`;

  const header = html`
    <div class="topbar">
      <${Wheel} />
      <div>
        <div class="wordmark">STAGE<span>COACH</span></div>
        <div class="tagline">One login. Every VM. One click.</div>
      </div>
      <div class="grow"></div>
      ${state.loggedIn && html`
        <button class="mini ghost" onClick=${() => loadInventory(true)} disabled=${busy === 'scan'}>
          ${busy === 'scan' ? html`<span class="spin"></span>` : '⟳'} Rescan Azure
        </button>`}
      <div class="account-chip">
        <span class=${'dot ' + (state.loggedIn ? 'on' : 'off')}></span>
        ${state.loggedIn && state.account
          ? html`<span>signed in as <b>${state.account.User}</b></span>`
          : html`<span>not signed in</span>`}
      </div>
    </div>`;

  if (!state.azCliPresent) return html`
    ${header}
    <div class="signin-wrap"><div class="card">
      <h2>Azure CLI missing</h2>
      <p class="sub">Stagecoach drives the Azure CLI. Install it from
        <b>aka.ms/azure-cli</b>, then restart Start-Stagecoach.</p>
    </div></div>`;

  if (!state.loggedIn) return html`
    ${header}
    <${SignInCard} busy=${busy === 'login'} onSignIn=${signIn} />
    <${Toasts} toasts=${toasts} />`;

  return html`
    ${header}
    ${state.missingExtensions && state.missingExtensions.length > 0 && html`
      <div class="banner">
        <span>Missing Azure CLI extensions: <b>${state.missingExtensions.join(', ')}</b> — needed for discovery and connections.</span>
        <div class="grow"></div>
        <button class="mini primary" onClick=${installExtensions} disabled=${busy === 'ext'}>
          ${busy === 'ext' ? html`<span class="spin"></span>` : 'Install now'}
        </button>
      </div>`}
    <div class="main">
      <div class="content">
        ${connections.length > 0 && html`
          <div class="section-title">Saddle up again — recent logins</div>
          <div class="recents">
            ${connections.slice(0, 8).map(c => html`
              <div key=${c.TargetId} class="recent-card" onClick=${() => reconnect(c)}
                   title=${'Last used ' + fmtTime(c.LastUsed)}>
                <div class="name">${c.TargetName}</div>
                <div class="meta">${c.Method}${c.Username ? ' · ' + c.Username : ' · Entra ID'}</div>
                <div class="go">Reconnect →</div>
              </div>`)}
          </div>`}

        <div class="section-title">Your estate</div>
        <div class="toolbar">
          <input type="text" placeholder="Search machines…" value=${search}
                 onInput=${e => setSearch(e.target.value)} />
          <button class=${'chip' + (kind === 'all' ? ' active' : '')} onClick=${() => setKind('all')}>All</button>
          <button class=${'chip' + (kind === 'vm' ? ' active' : '')} onClick=${() => setKind('vm')}>Azure VM</button>
          <button class=${'chip' + (kind === 'arc' ? ' active' : '')} onClick=${() => setKind('arc')}>Arc</button>
          <button class=${'chip' + (connectableOnly ? ' active' : '')}
                  onClick=${() => setConnectableOnly(!connectableOnly)}>Connectable only</button>
          <span class="count">
            ${machines === null ? html`<span class="spin"></span>` : filtered.length + ' of ' + machines.length + ' machines'}
          </span>
        </div>

        ${machines !== null && machines.length === 0 && busy !== 'scan' && html`
          <div class="empty">Nothing found. Check the account has reader access, then <b>Rescan Azure</b>.</div>`}

        ${machines !== null && machines.length > 0 && html`
          <table class="grid">
            <thead><tr>
              <th>Machine</th><th>Kind</th><th>OS</th><th>State</th><th>Route</th><th style=${{textAlign:'right'}}>Connect</th>
            </tr></thead>
            <tbody>
              ${filtered.map(m => h(Row, { key: m.Id, m, state, onOpen: () => setDrawer(m), onConnect: connect }))}
            </tbody>
          </table>`}
      </div>

      <div class="sessions">
        <div class="section-title" style=${{marginTop: 0}}>Live sessions</div>
        ${sessions.length === 0 && html`<div class="empty">No tunnels or sessions running.</div>`}
        ${sessions.map(s => html`
          <div key=${s.SessionId} class="session-card">
            <div class="name">${s.TargetName}</div>
            <div class="meta">${s.Method}${s.LocalPort ? ' · 127.0.0.1:' + s.LocalPort : ''}<br/>since ${fmtTime(s.StartTime)}</div>
            <button class="mini danger" onClick=${() => stopSession(s)}>Stop</button>
          </div>`)}
      </div>
    </div>

    ${drawer && h(Drawer, {
      m: drawer, state, connections,
      onClose: () => setDrawer(null), onConnect: connect, onArcSetup: arcSetup,
    })}
    <${Toasts} toasts=${toasts} />`;
}

function SignInCard({ busy, onSignIn }) {
  const [tenant, setTenant] = useState('');
  const [device, setDevice] = useState(false);
  return html`
    <div class="signin-wrap"><div class="card">
      <h2>Sign in once. Ride everywhere.</h2>
      <p class="sub">Stagecoach signs you in with Entra ID via <b>az login</b>, scans every
        tenant and subscription you can reach, and lists each VM with its working route —
        Bastion, Arc relay, or direct.</p>
      <div class="field">
        <label>Tenant ID <span style=${{opacity:.6}}>(optional — home tenant if blank)</span></label>
        <input type="text" value=${tenant} onInput=${e => setTenant(e.target.value)}
               placeholder="00000000-0000-0000-0000-000000000000" />
      </div>
      <label class="check">
        <input type="checkbox" checked=${device} onChange=${e => setDevice(e.target.checked)} />
        Use a device code (when a browser can’t pop up)
      </label>
      <button class="primary" style=${{width:'100%',padding:'11px',fontSize:'15px'}}
              disabled=${busy} onClick=${() => onSignIn(tenant.trim(), device)}>
        ${busy ? html`<span class="spin"></span>  Waiting for Microsoft sign-in…` : 'Sign in with Microsoft'}
      </button>
    </div></div>`;
}

function Row({ m, state, onOpen, onConnect }) {
  const isArc = m.Kind === 'ArcServer' || m.Kind === 1;
  const on = powerOn(m);
  const { caps, route, why } = capabilities(m, state.windowsClient);
  return html`
    <tr class=${'row' + (on ? '' : ' dim')} title=${on ? '' : 'Powered off / agent offline: ' + (m.PowerState || 'unknown')}>
      <td>
        <span class="machine-name" onClick=${onOpen}>${m.Name}</span>
        <div style=${{fontSize:'11.5px',color:'var(--faint)'}}>${m.ResourceGroup}</div>
      </td>
      <td><span class=${'badge ' + (isArc ? 'arc' : 'vm')}>${isArc ? 'Arc' : 'Azure VM'}</span></td>
      <td><span class="badge os">${m.OsType || '?'}</span></td>
      <td><span class=${'dot ' + (on ? 'on' : 'off')}></span></td>
      <td>
        ${route
          ? html`<span class="route">${route} <span class="why">· ${why}</span></span>`
          : html`<span class="noroute">${why}</span>`}
      </td>
      <td>
        <div class="btns">
          ${caps.map(c => html`
            <button key=${c.method} class="mini" disabled=${c.disabled || !on}
                    title=${c.reason || c.why}
                    onClick=${() => onConnect(m, c.method, '')}>${c.label}</button>`)}
          ${caps.length > 0 && html`<button class="mini ghost" title="Options…" onClick=${onOpen}>⋯</button>`}
        </div>
      </td>
    </tr>`;
}

function Drawer({ m, state, connections, onClose, onConnect, onArcSetup }) {
  const isArc = m.Kind === 'ArcServer' || m.Kind === 1;
  const isWin = /windows/i.test(m.OsType || '');
  const { caps } = capabilities(m, state.windowsClient);
  const saved = connections.find(c => c.TargetId === m.Id);
  const [method, setMethod] = useState((saved && saved.Method) || (caps[0] && caps[0].method) || 'Auto');
  const [user, setUser] = useState((saved && saved.Username) || '');

  return html`
    <div class="drawer-veil" onClick=${onClose}></div>
    <div class="drawer">
      <h3>${m.Name}</h3>
      <div class="sub">${isArc ? 'Azure Arc-enabled server' : 'Azure virtual machine'} · ${m.OsName || m.OsType || ''}</div>
      <div class="kv">
        <span class="k">Resource group</span><span class="v">${m.ResourceGroup}</span>
        <span class="k">Subscription</span><span class="v">${m.SubscriptionId}</span>
        <span class="k">Location</span><span class="v">${m.Location}</span>
        ${m.PrivateIpAddress && html`<span class="k">Private IP</span><span class="v">${m.PrivateIpAddress}</span>`}
        ${m.PublicIpAddress && html`<span class="k">Public IP</span><span class="v">${m.PublicIpAddress}</span>`}
        ${m.BastionName && html`<span class="k">Bastion</span><span class="v">${m.BastionName} (${m.BastionSku || 'SKU ?'}${m.BastionSameVNet ? ', same VNet' : ', via peering'})</span>`}
        ${m.DomainName && html`<span class="k">Domain</span><span class="v">${m.DomainName}</span>`}
        <span class="k">Power</span><span class="v">${m.PowerState || 'unknown'}</span>
      </div>

      <div class="section-title" style=${{marginTop: 0}}>Method</div>
      <div class="methods">
        ${caps.map(c => html`
          <label key=${c.method} class=${'method' + (method === c.method ? ' sel' : '')}
                 onClick=${() => !c.disabled && setMethod(c.method)}>
            <input type="radio" checked=${method === c.method} disabled=${c.disabled} readOnly />
            <div><div class="t">${c.label}</div><div class="d">${c.reason || c.why}</div></div>
          </label>`)}
        ${caps.length === 0 && html`<div class="empty">No working route to this machine.</div>`}
      </div>

      <div class="field">
        <label>Username — leave blank for your Entra ID identity${m.AdminUsername ? ' (VM admin: ' + m.AdminUsername + ')' : ''}</label>
        <input type="text" value=${user} onInput=${e => setUser(e.target.value)}
               placeholder=${m.AdminUsername || 'CORP\\user or localadmin'} />
      </div>

      ${isArc && isWin && html`
        <div class="setup-box">
          <div class="t">First time connecting to this Arc server?</div>
          <div class="d">SSH needs a one-time setup: the Azure-side connection endpoint, and
            OpenSSH on the server itself. Both changes are confirmed before anything is written.</div>
          <div style=${{display:'flex',gap:'8px'}}>
            <button class="mini" onClick=${() => onArcSetup(m, 'enable')}>Enable Arc SSH</button>
            <button class="mini" onClick=${() => onArcSetup(m, 'openssh')}>Install OpenSSH</button>
          </div>
        </div>`}

      <div class="drawer-actions">
        <button class="primary" disabled=${caps.length === 0}
                onClick=${() => onConnect(m, method, user.trim())}>Connect</button>
        <button onClick=${onClose}>Close</button>
      </div>
    </div>`;
}

const Toasts = ({ toasts }) => html`
  <div class="toasts">
    ${toasts.map(t => html`<div key=${t.id} class=${'toast' + (t.err ? ' err' : '')}>${t.msg}</div>`)}
  </div>`;

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
