<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stagecoach — Desktop Command Center</title>
  <link rel="icon" type="image/svg+xml" href="/images/stagecoach-icon.svg" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-sidebar: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-card: #334155;
      --badge-ad: #3b82f6;
      --badge-wg: #eab308;
      --badge-arc: #a855f7;
      --badge-azure: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
    
    /* Layout */
    .app-layout { display: flex; width: 100vw; height: 100vh; }
    .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border-card); display: flex; flex-direction: column; }
    .brand-section { padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border-card); }
    .brand-title { font-size: 1.1rem; font-weight: 800; color: var(--accent); letter-spacing: 0.05em; }
    .nav-tabs { flex: 1; padding: 1rem 0; display: flex; flex-direction: column; gap: 0.25rem; }
    .nav-item { padding: 0.75rem 1.5rem; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; transition: all 0.2s; }
    .nav-item:hover { background: var(--bg-card); color: var(--text-main); }
    .nav-item.active { background: var(--bg-card); color: var(--accent); border-left: 3px solid var(--accent); }
    
    .main-viewport { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-dark); }
    .top-header { height: 60px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-card); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }
    .view-container { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }

    /* UI Components */
    .btn { background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-card); border: 1px solid var(--border-card); color: var(--text-main); }
    .btn-secondary:hover { background: var(--bg-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .input { background: var(--bg-card); border: 1px solid var(--border-card); color: white; padding: 0.5rem 0.85rem; border-radius: 6px; outline: none; font-size: 0.85rem; }
    .input:focus { border-color: var(--accent); }

    /* Badges */
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-ad { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-wg { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-arc { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .badge-azure { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.4); }

    /* Table */
    table { width: 100%; border-collapse: collapse; background: var(--bg-sidebar); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-card); }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-card); font-size: 0.85rem; }
    th { background: #0b1120; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; font-weight: 700; }
    tr:hover { background: rgba(51, 65, 85, 0.4); }
    .star-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1rem; }
    .star-btn.starred { color: #facc15; }

    /* Cards */
    .card { background: var(--bg-sidebar); border: 1px solid var(--border-card); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.25rem; }
    .card-header { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }

    /* Drawer */
    .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 440px; background: #0f172a; border-left: 1px solid var(--border-card); padding: 2rem; box-shadow: -4px 0 24px rgba(0,0,0,0.6); z-index: 100; transform: translateX(100%); transition: transform 0.3s ease; overflow-y: auto; }
    .drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-card); padding-bottom: 1rem; }
    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.35rem; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const html = htm.bind(React.createElement);

    function App() {
      const [activeTab, setActiveTab] = React.useState('estate');
      const [inventory, setInventory] = React.useState(() => {
        const saved = localStorage.getItem('stagecoach_inventory');
        return saved ? JSON.parse(saved) : [];
      });
      const [favorites, setFavorites] = React.useState(() => {
        const saved = localStorage.getItem('stagecoach_favorites');
        return saved ? JSON.parse(saved) : [];
      });
      const [recents, setRecents] = React.useState(() => {
        const saved = localStorage.getItem('stagecoach_recents');
        return saved ? JSON.parse(saved) : [];
      });
      const [identities, setIdentities] = React.useState([]);
      const [syncing, setSyncing] = React.useState(false);
      const [statusMsg, setStatusMsg] = React.useState('Offline cache ready.');
      const [selectedTarget, setSelectedTarget] = React.useState(null);
      const [credInfo, setCredInfo] = React.useState(null);
      const [targetUser, setTargetUser] = React.useState('');
      const [targetPassword, setTargetPassword] = React.useState('');
      const [saveToVault, setSaveToVault] = React.useState(false);
      const [filterText, setFilterText] = React.useState('');
      const [filterDomain, setFilterDomain] = React.useState('ALL');
      const [filterKind, setFilterKind] = React.useState('ALL');
      const [connecting, setConnecting] = React.useState(false);

      // Save to localStorage
      React.useEffect(() => {
        localStorage.setItem('stagecoach_inventory', JSON.stringify(inventory));
      }, [inventory]);
      React.useEffect(() => {
        localStorage.setItem('stagecoach_favorites', JSON.stringify(favorites));
      }, [favorites]);
      React.useEffect(() => {
        localStorage.setItem('stagecoach_recents', JSON.stringify(recents));
      }, [recents]);

      // Initial load
      React.useEffect(() => {
        loadIdentities();
        loadCachedInventory();
      }, []);

      const loadCachedInventory = async () => {
        try {
          const res = await fetch('/api/inventory');
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setInventory(data);
              setStatusMsg(`Loaded ${data.length} machines from local store.`);
            }
          }
        } catch (e) {
          console.warn('Using local cache only.');
        }
      };

      const loadIdentities = async () => {
        try {
          const res = await fetch('/api/identities');
          if (res.ok) {
            const idData = await res.json();
            setIdentities(Array.isArray(idData) ? idData : [idData]);
          }
        } catch (e) {
          console.log('Identities fetch fallback.');
        }
      };

      const syncEstate = async () => {
        setSyncing(true);
        setStatusMsg('Syncing estate across all accessible Azure tenants in background...');
        try {
          const res = await fetch('/api/sync', { method: 'POST' });
          if (!res.ok) throw new Error('Sync failed');
          const data = await res.json();
          const items = Array.isArray(data) ? data : [data];
          setInventory(items);
          setStatusMsg(`Sync complete! Discovered ${items.length} machines. Stored locally.`);
        } catch (err) {
          setStatusMsg('Sync error: Make sure az login is active in your terminal.');
        } finally {
          setSyncing(false);
        }
      };

      const toggleFavorite = (id) => {
        setFavorites(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const handleSelectTarget = async (target) => {
        setSelectedTarget(target);
        setCredInfo(null);
        setTargetPassword('');
        setSaveToVault(false);
        const defaultUser = target.DomainType === 'ActiveDirectory' 
          ? (target.DomainName ? target.DomainName + '\\Administrator' : 'CORP\\Administrator')
          : '.\\Administrator';
        setTargetUser(defaultUser);

        try {
          const res = await fetch('/api/credentials', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(target)
          });
          if (res.ok) {
            const cred = await res.json();
            setCredInfo(cred);
            if (cred && cred.Username) setTargetUser(cred.Username);
          }
        } catch (e) {}
      };

      const handleConnect = async () => {
        if (!selectedTarget) return;
        setConnecting(true);
        setStatusMsg(`Launching remote session for ${selectedTarget.Name}...`);

        if (saveToVault && targetPassword) {
          try {
            await fetch('/api/credentials/save', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                TargetName: selectedTarget.Name,
                Password: targetPassword
              })
            });
          } catch (e) {}
        }

        try {
          const res = await fetch('/api/connect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              Target: selectedTarget,
              Username: targetUser
            })
          });
          if (!res.ok) throw new Error('Failed to launch connection');
          
          // Record recents
          setRecents(prev => [
            { id: selectedTarget.Id, name: selectedTarget.Name, kind: selectedTarget.Kind, time: new Date().toLocaleTimeString() },
            ...prev.filter(x => x.id !== selectedTarget.Id)
          ].slice(0, 8));

          setStatusMsg(`Session active! Remote Desktop (MSTSC) launched for ${selectedTarget.Name}.`);
          setSelectedTarget(null);
        } catch (err) {
          alert('Launch error: ' + err.message);
        } finally {
          setConnecting(false);
        }
      };

      const filtered = inventory.filter(vm => {
        const nameMatch = (vm.Name || vm.name || '').toLowerCase().includes(filterText.toLowerCase()) ||
                          (vm.DomainName || vm.domainName || '').toLowerCase().includes(filterText.toLowerCase());
        const domType = vm.DomainType || vm.domainType;
        const kind = vm.Kind || vm.kind;
        const domainMatch = filterDomain === 'ALL' || domType === filterDomain;
        const kindMatch = filterKind === 'ALL' || kind === filterKind;
        return nameMatch && domainMatch && kindMatch;
      }).sort((a, b) => {
        const aFav = favorites.includes(a.Id || a.id);
        const bFav = favorites.includes(b.Id || b.id);
        return bFav - aFav;
      });

      return html`
        <div class="app-layout">
          <!-- Sidebar Navigation -->
          <aside class="sidebar">
            <div class="brand-section">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
              <span class="brand-title">STAGECOACH</span>
            </div>
            <nav class="nav-tabs">
              <div class=${activeTab === 'estate' ? 'nav-item active' : 'nav-item'} onClick=${() => setActiveTab('estate')}>
                <span>🖥️</span> Estate
              </div>
              <div class=${activeTab === 'identities' ? 'nav-item active' : 'nav-item'} onClick=${() => setActiveTab('identities')}>
                <span>👤</span> Identities & Sync
              </div>
              <div class=${activeTab === 'sessions' ? 'nav-item active' : 'nav-item'} onClick=${() => setActiveTab('sessions')}>
                <span>⚡</span> Sessions & Recents
              </div>
              <div class=${activeTab === 'settings' ? 'nav-item active' : 'nav-item'} onClick=${() => setActiveTab('settings')}>
                <span>⚙️</span> Settings
              </div>
            </nav>
          </aside>

          <!-- Main Viewport -->
          <main class="main-viewport">
            <header class="top-header">
              <span style=${{fontSize: '0.85rem', color: 'var(--text-muted)'}}>${statusMsg}</span>
              <div style=${{display: 'flex', gap: '0.75rem', alignItems: 'center'}}>
                <button class="btn" disabled=${syncing} onClick=${syncEstate}>
                  ${syncing ? 'Syncing Azure...' : '↻ Sync Estate'}
                </button>
              </div>
            </header>

            <div class="view-container">
              <!-- Tab 1: Estate Inventory -->
              ${activeTab === 'estate' && html`
                <div>
                  <div style=${{display: 'flex', gap: '1rem', marginBottom: '1.25rem', flexWrap: 'wrap'}}>
                    <input class="input" style=${{flex: '1', minWidth: '260px'}} placeholder="Instant search by machine name, domain, or tag..." value=${filterText} onInput=${e => setFilterText(e.target.value)} />
                    <select class="input" value=${filterKind} onChange=${e => setFilterKind(e.target.value)}>
                      <option value="ALL">All Kinds</option>
                      <option value="ArcServer">Azure Arc Server</option>
                      <option value="AzureVM">Azure VM</option>
                    </select>
                    <select class="input" value=${filterDomain} onChange=${e => setFilterDomain(e.target.value)}>
                      <option value="ALL">All Identity Types</option>
                      <option value="ActiveDirectory">Active Directory</option>
                      <option value="Workgroup">Workgroup</option>
                      <option value="EntraID">Entra ID</option>
                    </select>
                  </div>

                  <table>
                    <thead>
                      <tr>
                        <th style=${{width: '40px'}}>★</th>
                        <th>Target Name</th>
                        <th>Kind</th>
                        <th>OS</th>
                        <th>Domain / Identity</th>
                        <th>Power</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${filtered.length === 0 ? html`
                        <tr>
                          <td colspan="7" style=${{textAlign: 'center', padding: '3rem', color: 'var(--text-muted)'}}>
                            ${syncing ? 'Scanning Azure Resource Graph...' : 'No machines in local store. Click "↻ Sync Estate" or check Identities tab.'}
                          </td>
                        </tr>
                      ` : filtered.map(item => {
                        const id = item.Id || item.id || item.Name;
                        const name = item.Name || item.name;
                        const kind = item.Kind || item.kind;
                        const os = item.OsName || item.osName || 'Windows';
                        const domainName = item.DomainName || item.domainName || '';
                        const domainType = item.DomainType || item.domainType;
                        const power = item.PowerState || item.powerState || 'Connected';
                        const isFav = favorites.includes(id);

                        return html`
                          <tr key=${id}>
                            <td>
                              <button class=${isFav ? 'star-btn starred' : 'star-btn'} onClick=${() => toggleFavorite(id)}>★</button>
                            </td>
                            <td><strong>${name}</strong></td>
                            <td>
                              <span class=${kind === 'ArcServer' ? 'badge badge-arc' : 'badge badge-azure'}>
                                ${kind}
                              </span>
                            </td>
                            <td>${os}</td>
                            <td>
                              <span class=${domainType === 'ActiveDirectory' ? 'badge badge-ad' : domainType === 'Workgroup' ? 'badge badge-wg' : 'badge badge-azure'}>
                                ${domainName || domainType}
                              </span>
                            </td>
                            <td><span style=${{color: '#4ade80'}}>● ${power}</span></td>
                            <td>
                              <button class="btn" style=${{padding: '0.35rem 0.75rem', fontSize: '0.8rem'}} onClick=${() => handleSelectTarget(item)}>
                                Connect
                              </button>
                            </td>
                          </tr>
                        `;
                      })}
                    </tbody>
                  </table>
                </div>
              `}

              <!-- Tab 2: Identities & Sync -->
              ${activeTab === 'identities' && html`
                <div>
                  <div class="card">
                    <div class="card-header">
                      <span>Connected Microsoft Entra Accounts</span>
                      <button class="btn" onClick=${syncEstate} disabled=${syncing}>Sync All Tenants</button>
                    </div>
                    ${identities.length === 0 ? html`
                      <p style=${{color: 'var(--text-muted)', fontSize: '0.85rem'}}>No active az CLI session detected. Run <code>az login</code> in PowerShell.</p>
                    ` : identities.map(id => html`
                      <div key=${id.AccountName} style=${{marginBottom: '1rem', padding: '1rem', background: 'var(--bg-dark)', borderRadius: '6px'}}>
                        <div style=${{fontWeight: '700', color: 'var(--accent)', marginBottom: '0.5rem'}}>👤 ${id.AccountName}</div>
                        <div style=${{fontSize: '0.8rem', color: 'var(--text-muted)'}}>
                          Accessible Tenants: ${id.Tenants ? id.Tenants.length : 1}
                        </div>
                      </div>
                    `)}
                  </div>
                </div>
              `}

              <!-- Tab 3: Sessions & Recents -->
              ${activeTab === 'sessions' && html`
                <div>
                  <div class="card">
                    <div class="card-header">Recent Connections</div>
                    ${recents.length === 0 ? html`
                      <p style=${{color: 'var(--text-muted)', fontSize: '0.85rem'}}>No recent connections yet. Connect to a machine from the Estate tab.</p>
                    ` : html`
                      <table>
                        <thead>
                          <tr>
                            <th>Machine Name</th>
                            <th>Kind</th>
                            <th>Time</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${recents.map(r => html`
                            <tr key=${r.id}>
                              <td><strong>${r.name}</strong></td>
                              <td><span class=${r.kind === 'ArcServer' ? 'badge badge-arc' : 'badge badge-azure'}>${r.kind}</span></td>
                              <td>${r.time}</td>
                              <td>
                                <button class="btn" style=${{padding: '0.25rem 0.5rem', fontSize: '0.75rem'}} onClick=${() => {
                                  const target = inventory.find(x => (x.Id || x.id) === r.id);
                                  if (target) handleSelectTarget(target);
                                }}>
                                  Reconnect
                                </button>
                              </td>
                            </tr>
                          `)}
                        </tbody>
                      </table>
                    `}
                  </div>
                </div>
              `}

              <!-- Tab 4: Settings -->
              ${activeTab === 'settings' && html`
                <div>
                  <div class="card">
                    <div class="card-header">Preferences & Storage</div>
                    <div class="field">
                      <label>Default Key Vault Name</label>
                      <input class="input" style=${{width: '320px'}} defaultValue="kv-hcs-vault-01" />
                    </div>
                    <div class="field">
                      <label>Local Persistent Cache</label>
                      <p style=${{fontSize: '0.85rem', color: 'var(--text-muted)'}}>
                        Discovered VMs cached locally: <strong>${inventory.length} machines</strong>
                      </p>
                    </div>
                  </div>
                </div>
              `}
            </div>
          </main>

          <!-- Slide-Over Connect Drawer -->
          <div class=${selectedTarget ? 'drawer open' : 'drawer'}>
            ${selectedTarget && html`
              <div>
                <div class="drawer-header">
                  <h3>Connect to ${selectedTarget.Name || selectedTarget.name}</h3>
                  <button class="btn btn-secondary" style=${{padding: '0.2rem 0.5rem'}} onClick=${() => setSelectedTarget(null)}>✕</button>
                </div>

                <div class="field">
                  <label>Connection Route</label>
                  <div style=${{fontSize: '0.9rem', color: '#38bdf8', fontWeight: '600'}}>
                    ${(selectedTarget.Kind || selectedTarget.kind) === 'ArcServer' 
                      ? '⚡ Azure Arc SSH Relay (az ssh arc --rdp)' 
                      : (selectedTarget.BastionHostId ? '⚡ Azure Bastion Native Client' : '⚡ Direct MSTSC')}
                  </div>
                </div>

                <div class="field">
                  <label>Domain Status</label>
                  <div>
                    <span class=${(selectedTarget.DomainType || selectedTarget.domainType) === 'ActiveDirectory' ? 'badge badge-ad' : 'badge badge-wg'}>
                      ${(selectedTarget.DomainType || selectedTarget.domainType) === 'ActiveDirectory' 
                        ? 'AD Domain: ' + (selectedTarget.DomainName || selectedTarget.domainName) 
                        : 'Standalone Workgroup'}
                    </span>
                  </div>
                </div>

                <div class="field">
                  <label>Target Account</label>
                  <input class="input" style=${{width: '100%'}} value=${targetUser} onInput=${e => setTargetUser(e.target.value)} />
                </div>

                <div class="field">
                  <label>Resolved Credential Status</label>
                  <div style=${{fontSize: '0.85rem', color: credInfo && credInfo.Source !== 'None' ? '#4ade80' : '#facc15'}}>
                    ${credInfo && credInfo.Source !== 'None' 
                      ? `✓ Resolved via ${credInfo.Source}` 
                      : 'ℹ Operator session / Prompt'}
                  </div>
                </div>

                ${(!credInfo || credInfo.Source === 'None') && (selectedTarget.DomainType || selectedTarget.domainType) === 'Workgroup' && html`
                  <div class="field" style=${{background: 'rgba(255,255,255,0.03)', padding: '0.75rem', borderRadius: '6px'}}>
                    <label>Local Password (Optional)</label>
                    <input type="password" class="input" style=${{width: '100%', marginBottom: '0.5rem'}} placeholder="•••••••••" value=${targetPassword} onInput=${e => setTargetPassword(e.target.value)} />
                    <label style=${{display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', fontSize: '0.8rem'}}>
                      <input type="checkbox" checked=${saveToVault} onChange=${e => setSaveToVault(e.target.checked)} />
                      <span>Save to Key Vault (kv-hcs-vault-01) for next time</span>
                    </label>
                  </div>
                `}

                <div style=${{marginTop: '2rem', display: 'flex', gap: '0.75rem'}}>
                  <button class="btn" style=${{flex: '1'}} disabled=${connecting} onClick=${handleConnect}>
                    ${connecting ? 'Launching Remote Desktop...' : 'Launch 1-Click RDP'}
                  </button>
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
